name: Build Release Assets

on:
  release:
    types: [created]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - run: npm install

      - run: npm run build

      - name: Upload assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            main.js
            manifest.json
